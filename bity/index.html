}

/* ============ Importação do bity (bot do WhatsApp) ============ */
// O bity é a fonte dos dados: importar troca os dados do app pelos do backup. O bot não é alterado.
const capWords = s => String(s || '').replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
function bityToState(backup){
  const fin = backup.financas || {};
  if (fin.versao !== 3 || typeof fin.contas !== 'object') throw new Error('versao');
  const keys = Object.keys(fin.contas);
  if (!keys.length) throw new Error('vazio');
  const key = fin.contas.eu ? 'eu' : keys.sort((a, b) => (fin.contas[b].transacoes || []).length - (fin.contas[a].transacoes || []).length)[0];
  const c = fin.contas[key];
  const st = defaultState();
  const cents = v => Math.round(Number(v || 0) * 100);
  st.holders = [{id:'h-eu', name:String(c.titular || 'Eu').slice(0, 40)}];
  const accBy = {}, pigBy = {}, cardBy = {}, warn = [], ids = new Set();
  // ids fixos a partir do nome no bity: a tela não perde o cartão ou banco escolhido a cada sincronização
  const sid = (pre, nome) => { let b = pre + (norm(nome).replace(/[^a-z0-9]+/g, '-') || 'x'), id = b, i = 2; while (ids.has(id)) id = b + '-' + i++; ids.add(id); return id; };
  const mkAcc = nome => {
    const n = norm(nome);
    if (!accBy[n]){ const a = {id:sid('ba-', n), name:capWords(nome), holderId:'h-eu', initial:0, color:PALETTE[st.accounts.length % PALETTE.length], bityName:n === 'conta principal' ? null : n}; st.accounts.push(a); accBy[n] = a.id; }
    return accBy[n];
  };
  const mkCard = nome => {
    const n = norm(nome || 'cartão');
    if (!cardBy[n]){ const k = {id:sid('bk-', n), name:capWords(n), holderId:'h-eu', limit:0, closingDay:1, dueDay:10, color:PALETTE[(st.cards.length + 4) % PALETTE.length], payAccountId:null, noDates:true, bityName:null}; st.cards.push(k); cardBy[n] = k; warn.push(`cartão ${k.name} sem limite e sem datas`); }
    return cardBy[n];
  };
  const real = (c.bancos || []).filter(b => b.tipo !== 'cofrinho');
  real.forEach(b => mkAcc(b.nome));
  for (const k of c.cartoes || []){
    const card = {id:sid('bk-', k.nome), name:capWords(k.nome), holderId:'h-eu', limit:cents(k.limite), closingDay:k.fechamento || 1, dueDay:k.vencimento || 10, color:PALETTE[(st.cards.length + 4) % PALETTE.length], payAccountId:null, bityName:norm(k.nome)};
    if (!k.fechamento){ card.noDates = true; warn.push(`cartão ${card.name} sem dia de fechamento`); }
    st.cards.push(card); cardBy[norm(k.nome)] = card;
  }
  for (const b of (c.bancos || []).filter(b => b.tipo === 'cofrinho')){
    const card = !b.apelido && b.cartao ? mkCard(b.cartao) : null;
    const p = {id:sid('bp-', b.nome), bityName:norm(b.nome), name:b.apelido ? capWords(b.apelido) : 'Cofrinho ' + capWords(String(b.nome).replace(/^cofrinho-?/, '')),
      kind:card ? 'limit' : 'common', cardId:card ? card.id : null, accountId:b.banco ? mkAcc(b.banco) : null, goal:0, color:PALETTE[(st.piggies.length + 2) % PALETTE.length]};
    st.piggies.push(p); pigBy[norm(b.nome)] = p.id;
  }
  const principal = c.principal ? norm(c.principal) : real[0] ? norm(real[0].nome) : null;
  const bankOf = t => t.banco ? norm(t.banco) : !real.length ? 'conta principal' : ({dinheiro:'carteira', vale:'vale'})[t.metodo] || principal || 'conta principal';
  const where = t => { const n = bankOf(t); return pigBy[n] ? {pig:pigBy[n]} : {acc:mkAcc(n)}; };
  const catId = (nome, kind) => {
    let n = norm(nome || 'outros'); if (n === 'comida') n = 'alimentacao';
    if (n === 'outros') return st.categories.find(x => x.kind === kind && norm(x.name).startsWith('outr')).id;
    let cat = st.categories.find(x => x.kind === kind && norm(x.name) === n);
    if (!cat){ cat = {id:sid('bc-', kind + '-' + n), name:capWords(nome), kind, budget:0, color:PALETTE[st.categories.length % PALETTE.length]}; st.categories.push(cat); }
    cat.bityName = cat.bityName || norm(nome);
    return cat.id;
  };
  for (const l of c.limites || []) byId(st.categories, catId(l.categoria, 'expense')).budget = cents(l.valor);
  const bityInv = (t, card) => t.fatura || (card.noDates ? t.data.slice(0, 7) : invKey(card, t.data));
  const groups = {};
  for (const t of c.transacoes || []) if (t.vinculo && !t.parcela) (groups[t.vinculo] = groups[t.vinculo] || []).push(t);
  const used = new Set(), out = [];
  let cur = null;
  const add = o => out.push(Object.assign({id:sid('bt-', cur.id || uid()), bityId:cur.id || null}, o));
  for (const t of c.transacoes || []){
    if (used.has(t) || !(Number(t.valor) > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(t.data || '')) continue;
    used.add(t); cur = t;
    const cat = norm(t.categoria), v = cents(t.valor);
    const other = t.vinculo && !t.parcela ? (groups[t.vinculo] || []).find(x => !used.has(x) && x.tipo !== t.tipo) : null;
    if (other && cat === 'entre-bancos' && norm(other.categoria) === 'entre-bancos' && t.metodo !== 'credito' && other.metodo !== 'credito'){
      used.add(other);
      const sai = t.tipo === 'despesa' ? t : other, ent = t.tipo === 'despesa' ? other : t, A = where(sai), B = where(ent), base = {date:sai.data, amount:v};
      if (A.acc && B.acc){ if (A.acc !== B.acc) add({...base, type:'transfer', desc:'Transferência', accountId:A.acc, toAccountId:B.acc}); }
      else if (A.acc && B.pig) add({...base, type:'piggy_in', desc:'', accountId:A.acc, piggyId:B.pig});
      else if (A.pig && B.acc) add({...base, type:'piggy_out', desc:'', accountId:B.acc, piggyId:A.pig});
      else { add({...base, type:'adjust', amount:-v, desc:'Saiu para outro cofrinho', piggyId:A.pig, accountId:null}); add({...base, type:'adjust', desc:'Veio de outro cofrinho', piggyId:B.pig, accountId:null}); }
      continue;
    }
    if (other && cat === 'fatura' && (t.metodo === 'credito') !== (other.metodo === 'credito')){
      used.add(other);
      const pag = t.metodo === 'credito' ? other : t, abat = t.metodo === 'credito' ? t : other, card = mkCard(abat.cartao);
      add({type:'card_payment', date:pag.data, amount:cents(pag.valor), desc:'Pagamento da fatura', cardId:card.id, invoice:bityInv(abat, card), accountId:where(pag).acc || null});
      continue;
    }
    if (t.metodo === 'credito'){
      const card = mkCard(t.cartao);
      if (cat === 'fatura' && t.tipo === 'receita'){ add({type:'card_payment', date:t.data, amount:v, desc:t.descricao || 'Pagamento da fatura', cardId:card.id, invoice:bityInv(t, card), accountId:null}); continue; }
      const p = t.parcela && t.parcela.total > 1 ? t.parcela : null;
      add({type:'card', date:t.data, amount:t.tipo === 'receita' ? -v : v, desc:capWords(t.descricao).slice(0, 80), categoryId:catId(t.categoria, 'expense'), cardId:card.id,
        invoice:bityInv(t, card), buyDate:p ? addMonths(t.data, -(p.atual - 1)) : t.data, groupId:p ? 'b-' + (t.vinculo || uid()) : null, inst:p ? p.atual : 1, instTotal:p ? p.total : 1});
      continue;
    }
    const w = where(t);
    if (w.pig || cat === 'ajuste' || cat === 'entre-bancos' || cat === 'fatura'){
      add({type:'adjust', date:t.data, amount:t.tipo === 'receita' ? v : -v, desc:capWords(t.descricao) || 'Ajuste de saldo', accountId:w.acc || null, piggyId:w.pig || null});
      continue;
    }
    const kind = t.tipo === 'receita' ? 'income' : 'expense';
    add({type:kind, date:t.data, amount:v, desc:capWords(t.descricao).slice(0, 80) || TYPE_LABEL[kind], categoryId:catId(t.categoria, kind), accountId:w.acc});
  }
  st.tx = out;
  st.source = {from:'bity', at:backup.criadoEm || new Date().toISOString()};
  const skipped = [];
  if ((c.metas || []).length) skipped.push(`${c.metas.length} meta(s)`);
  if ((c.fixos || []).length) skipped.push(`${c.fixos.length} gasto(s) fixo(s)`);
  return {st, warn, skipped, accounts:keys.length};
}
async function importBity(data){
  let r;
  try { r = bityToState(data); }
  catch (e){ return toast(e.message === 'versao' ? 'Backup do bity em formato antigo. Atualize o bot e mande #backup de novo.' : 'Esse backup do bity não tem lançamentos.'); }
  if (!(await ask(`Importar o backup do bity de ${fdate(String(data.criadoEm || '').slice(0, 10)) || 'data desconhecida'}? São ${r.st.tx.length} lançamentos. Os dados atuais do app serão trocados pelos do bot (o bot não muda).`, 'Importar', true))) return;
  const keep = S.settings;
  S = r.st; S.settings = Object.assign(S.settings, keep, {hide:keep.hide});
  UI.bank = 'all'; UI.cardId = null; UI.invoice = null; UI.tab = 'resumo'; UI.month = monthOf(todayISO());
  save(); render(); window.scrollTo(0, 0);
  const notes = [];
  if (r.warn.length) notes.push(`Confira em Cartões: ${r.warn.join('; ')}.`);
  if (r.skipped.length) notes.push(`Ficaram só no bot: ${r.skipped.join(' e ')}.`);
  if (r.accounts > 1) notes.push('O backup tinha mais de uma pessoa; importei só a sua conta.');
  if (notes.length) openSheet('Importado do bity', `<p style="margin:0">${S.tx.length} lançamentos importados.</p>${notes.map(n => `<div class="hint">${esc(n)}</div>`).join('')}<button class="btn primary" data-act="close-sheet">Ver meus dados</button>`);
  else toast(`${S.tx.length} lançamentos importados do bity`);
}

/* ============ Conexão com o bity no mesmo celular ============ */
// Com a conexão ligada, o bity é o único lugar dos dados: o app lê do bot e manda cada lançamento para ele.
const LINK = {status:'off', msg:'', at:null, busy:false};
const linked = () => !!(S.settings.link && S.settings.link.code);
async function linkFetch(path, opts = {}){
  const l = S.settings.link;
  let r;
  try {
    r = await fetch(`http://127.0.0.1:${l.port}${path}`, {...opts, headers:{'Authorization':'Bearer ' + l.code, 'Content-Type':'application/json'}, cache:'no-store'});
  } catch (e){
    throw new Error(IN_VIEWER ? 'Dentro do Claude o app não alcança o bity. Use g4vo-dev.github.io/bity ou o APK no celular do bot.' : 'O bity não respondeu. Confira se o bot está ligado neste celular e se você mandou #app ligar.');
  }
  let j = {}; try { j = await r.json(); } catch (e){}
  if (!r.ok) throw new Error(r.status === 401 ? 'Código errado. Mande #app no WhatsApp e cole o código de novo.' : (j.erro ? 'bity: ' + j.erro : 'O bity respondeu com erro ' + r.status + '.'));
  return j;
}
async function linkSync(silent){
  if (!linked() || LINK.busy) return false;
  LINK.busy = true;
  try {
    const data = await linkFetch('/v1/backup');
    const r = bityToState(data);
    const keep = S.settings;
    S = r.st; S.settings = keep;
    LINK.status = 'ok'; LINK.msg = ''; LINK.at = new Date();
    save(); if ($('#sheet').hidden) render(); else renderChip();
    if (!silent) toast('Atualizado com o bity');
    return true;
  } catch (e){
    LINK.status = 'erro'; LINK.msg = e.message; renderChip();
    if (!silent) toast(e.message);
    else if (UI.tab === 'dados' && $('#sheet').hidden) render();
    return false;
  } finally { LINK.busy = false; }
}
function renderChip(){
  const el = $('#link-chip'); if (!el) return;
  if (!linked()){ el.hidden = true; return; }
  el.hidden = false;
  el.className = 'link-chip ' + (LINK.status === 'ok' ? 'on' : LINK.status === 'erro' ? 'bad' : '');
  el.textContent = LINK.status === 'ok' ? 'bity' : LINK.status === 'erro' ? 'bity offline' : 'bity…';
  el.title = LINK.status === 'erro' ? LINK.msg : LINK.at ? 'Atualizado às ' + LINK.at.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';
}
const reais = c => Math.round(c) / 100;
function bityNameOf(kind, id){
  const x = kind === 'acc' ? byId(S.accounts, id) : kind === 'pig' ? byId(S.piggies, id) : byId(S.cards, id);
  if (!x) throw new Error('Escolha um banco, cofrinho ou cartão.');
  if (!x.bityName){
    if (kind === 'acc' && x.id.startsWith('ba-conta-principal')) return null;
    throw new Error(`${x.name} não existe no bity. Cadastre pelo WhatsApp e atualize.`);
  }
  return x.bityName;
}
function catBity(id){
  const c = catOf(id); if (!c) return 'outros';
  return c.bityName || (norm(c.name).startsWith('outr') ? 'outros' : norm(c.name));
}
// Converte as linhas montadas pelo formulário no pedido que o bity entende.
function rowsToOp(rows){
  const t = rows[0], base = {data:t.date, descricao:t.desc || ''};
  switch (t.type){
    case 'income': case 'expense': return {...base, op:t.type === 'income' ? 'receita' : 'despesa', valor:reais(t.amount), banco:bityNameOf('acc', t.accountId), categoria:catBity(t.categoryId)};
    case 'card': return {...base, op:'credito', data:t.buyDate || t.date, valor:reais(sum(rows, r => r.amount)), parcelas:rows.length, cartao:bityNameOf('card', t.cardId), categoria:catBity(t.categoryId)};
    case 'transfer': return {...base, op:'transferencia', valor:reais(t.amount), de:bityNameOf('acc', t.accountId), para:bityNameOf('acc', t.toAccountId)};
    case 'piggy_in': return {...base, op:'transferencia', valor:reais(t.amount), de:bityNameOf('acc', t.accountId), para:bityNameOf('pig', t.piggyId)};
    case 'piggy_out': return {...base, op:'transferencia', valor:reais(t.amount), de:bityNameOf('pig', t.piggyId), para:bityNameOf('acc', t.accountId)};
    case 'adjust': return {...base, op:'ajuste', diferenca:reais(t.amount), banco:t.piggyId ? bityNameOf('pig', t.piggyId) : bityNameOf('acc', t.accountId)};
    case 'card_payment': return {...base, op:'fatura', valor:reais(t.amount), cartao:bityNameOf('card', t.cardId), banco:t.accountId ? bityNameOf('acc', t.accountId) : null};
  }
  throw new Error('Tipo de lançamento não suportado.');
}
async function linkSave(rows, orig){
  const op = rowsToOp(rows);
  await linkFetch('/v1/lancamentos', {method:'POST', body:JSON.stringify(op)});
  if (orig && orig.bityId){
    try { await linkFetch('/v1/lancamentos/' + encodeURIComponent(orig.bityId), {method:'DELETE'}); }
    catch (e){ await linkSync(true); throw new Error('O novo lançamento foi salvo no bity, mas o antigo não saiu. Apague o antigo pelo extrato.'); }
  }
  await linkSync(true);
}
async function linkDelete(t){
  if (!t.bityId) throw new Error('Esse lançamento não veio do bity.');
  await linkFetch('/v1/lancamentos/' + encodeURIComponent(t.bityId), {method:'DELETE'});
  await linkSync(true);
}
function linkBlock(){
  if (!linked()) return false;
  toast('Conectado ao bity: cadastre bancos, cartões, cofrinhos e limites pelo WhatsApp.');
  return true;
}

  'month': d => { UI.month = shiftMonth(UI.month, +d.d); UI.catSel = null; UI.barSel = null; render(); },
  'month-today': () => { UI.month = monthOf(todayISO()); render(); },
  'new-tx': d => openTxForm(null, Object.fromEntries(Object.entries({type:d.type, cardId:d.card, piggyId:d.piggy, action:d.action}).filter(([, v]) => v))),
  'edit-tx': d => { const t = byId(S.tx, d.id); if (t) openTxForm(t); },
  'cat-sel': d => { UI.catSel = UI.catSel === d.id ? null : d.id; render(); },
  'bar-sel': d => { UI.barSel = UI.barSel === d.k ? null : d.k; render(); },
  'bank': d => { UI.bank = d.id; render(); },
  'kind': d => { UI.kind = d.id; render(); },
  'go-bank': d => { UI.tab = 'extrato'; UI.bank = d.id; UI.kind = 'all'; render(); window.scrollTo(0, 0); },
  'go-card': d => { UI.tab = 'cartoes'; UI.cardId = d.id; UI.invoice = d.key; render(); window.scrollTo(0, 0); },
  'card-sel': d => { UI.cardId = d.id; UI.invoice = null; render(); },
  'inv-sel': d => { UI.invoice = d.key; render(); },
  'pay-invoice': d => { const c = byId(S.cards, d.id), inf = invoiceInfo(c, d.key);
    openTxForm(null, {type:'card_payment', cardId:c.id, invoice:d.key, amount:inf.rest, accountId:c.payAccountId || S.accounts[0]?.id, desc:'Pagamento da fatura'}); },
  'adjust-acc': d => openTxForm(null, {type:'adjust', target:'a:' + d.id, accountId:d.id, real:null}),
  'adjust-piggy': d => openTxForm(null, {type:'adjust', target:'p:' + d.id, real:null, desc:'Rendimento'}),
  'new-acc': () => accForm(null), 'edit-acc': d => accForm(byId(S.accounts, d.id)),
  'new-holder': () => holderForm(null), 'edit-holder': d => holderForm(byId(S.holders, d.id)),
  'new-cat': () => catForm(null), 'edit-cat': d => catForm(byId(S.categories, d.id)),
  'new-card': () => cardForm(null), 'edit-card': d => cardForm(byId(S.cards, d.id)),
  'new-piggy': () => { if (!S.accounts.length) return needAccount(); piggyForm(null); }, 'edit-piggy': d => piggyForm(byId(S.piggies, d.id)),
  'toggle-hide': () => { S.settings.hide = !S.settings.hide; save(); render(); },
  'toggle-theme': () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (S.settings.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); S.settings.theme = dark ? 'light' : 'dark'; save(); applyTheme(); if (UI.tab === 'dados') render(); },
  'set-theme': d => { S.settings.theme = d.v; save(); applyTheme(); render(); },
  'plan-fill-pat': () => { S.plan.patrimonio = Math.max(0, totalAccounts() + totalPiggies()); save(); render(); },
  'plan-fill-gas': () => { const cur = monthOf(todayISO()); const ms = [1, 2, 3].map(i => monthStats(shiftMonth(cur, -i)).exp); const avg = Math.round(sum(ms) / 3); if (!avg) return toast('Ainda não há gastos nos últimos 3 meses.'); S.plan.gasto = avg; save(); render(); toast('Média dos últimos 3 meses: ' + fmt(avg)); },
  'export-json': () => exportJSON(), 'export-csv': () => exportCSV(),
  'import-json': () => $('#file-json').click(), 'import-csv': () => { if (!linkBlock()) $('#file-csv').click(); },
  'save-ai': () => { S.settings.aiKey = $('#ai-key').value.trim(); S.settings.aiModel = $('#ai-model').value.trim() || 'gemini-2.5-flash'; save(); render(); toast(S.settings.aiKey ? 'Chave salva neste navegador' : 'Chave removida'); },
  'del-ai': () => { S.settings.aiKey = ''; save(); render(); toast('Chave apagada'); },
  'load-sample': async () => {
    if (linkBlock()) return;
    if (S.tx.length && !S.isSample && !(await ask('Carregar os dados de exemplo? Isso substitui seus dados atuais. Faça um backup antes, se quiser guardar.', 'Carregar exemplo', true))) return;
    const keep = S.settings; sampleState(); S.settings = Object.assign(S.settings, keep, {hide:false});
    UI.month = monthOf(todayISO()); UI.bank = 'all'; UI.cardId = null; UI.invoice = null; UI.tab = 'resumo';
    closeSheet(); save(); render(); window.scrollTo(0, 0); toast('Dados de exemplo carregados');
  },
  'clear-all': async () => {
    if (linkBlock()) return;
    if (!(await ask(S.isSample ? 'Apagar os dados de exemplo e começar do zero?' : 'Apagar todos os seus dados deste navegador? Isso não tem volta.', 'Apagar tudo', true))) return;
    const keep = S.settings; S = defaultState(); S.settings = Object.assign(S.settings, keep);
    UI.bank = 'all'; UI.cardId = null; UI.invoice = null; UI.tab = 'dados';
    save(); render(); window.scrollTo(0, 0); toast('Tudo limpo. Comece cadastrando um banco.');
  },
  'link-connect': async () => {
    const port = parseInt($('#lk-port').value, 10), code = $('#lk-code').value.trim();
    if (!(port > 0 && port < 65536) || code.length < 10) return toast('Confira a porta e o código que o bity mandou.');
    if (!S.isSample && !S.source && S.tx.length && !(await ask('Conectar ao bity? Os dados que estão no app serão trocados pelos do bot. Faça um backup antes, se quiser guardar.', 'Conectar', true))) return;
    S.settings.link = {port, code}; LINK.status = 'off'; save();
    if (await linkSync(true)){ UI.tab = 'resumo'; render(); window.scrollTo(0, 0); toast('Conectado ao bity'); }
    else { const msg = LINK.msg; delete S.settings.link; LINK.status = 'off'; save(); render(); toast(msg); }
  },
  'link-sync': () => linkSync(false),
  'link-off': async () => {
    if (!(await ask('Desconectar do bity? O app guarda a última cópia dos dados, mas deixa de mandar lançamentos para o bot.', 'Desconectar', true))) return;
    delete S.settings.link; LINK.status = 'off'; save(); render(); toast('Desconectado');
  },
  'close-sheet': () => closeSheet()
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  if (b.closest('#sheet') && b.dataset.act !== 'close-sheet' && b.dataset.act !== 'load-sample') closeSheet();
  f(b.dataset, b, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'ext-q'){ UI.q = e.target.value; const had = !!$('.monthnav'); if (had === !!UI.q){ const pos = e.target.selectionStart; render(); const q = $('#ext-q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x){} } else renderExtList(); return; }
  if (e.target.closest('#plan')){
    const p = S.plan, m = id => { const v = parseMoney($(id).value || '0'); return isNaN(v) ? 0 : Math.max(0, v); };
    p.patrimonio = m('#pl-pat'); p.aporte = m('#pl-apo'); p.gasto = m('#pl-gas');
    const tx = parseFloat(String($('#pl-tax').value).replace(',', '.')); p.taxa = isNaN(tx) ? 0 : tx;
    p.idade = $('#pl-ida').value.replace(/\D/g, '').slice(0, 3);
    save(); renderPlan();
  }
});
document.addEventListener('change', e => {
  const id = e.target.id; if (id !== 'file-json' && id !== 'file-csv') return;
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => id === 'file-json' ? importJSON(String(r.result)) : importCSV(String(r.result));
  r.onerror = () => toast('Não consegui ler o arquivo.');
  r.readAsText(f, 'utf-8');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('#dlg').hidden) $('#dlg').click(); else if (!$('#sheet').hidden) closeSheet(); } });
$('#sheet').addEventListener('mousedown', e => { if (e.target.id === 'sheet') closeSheet(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.settings.theme === 'system') applyTheme(); });

/* ============ Início ============ */
if (!load()){ sampleState(); save(); }
applyTheme();
render();
if (linked()) linkSync(true);
</script>

<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
